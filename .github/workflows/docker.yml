name: Build and Push Docker Image

on:
  push:
    branches: [ essentrix83 ]
    tags: [ 'v*', '*-essentrix.*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 emulation for the runtime stage (pure-Python deps, so no
      # compilation happens under QEMU — see the frontend note in Dockerfile).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/essentrix83/auditorr
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=1.7.2-essentrix.1,enable=${{ github.ref == 'refs/heads/essentrix83' }}
            type=sha,prefix={{branch}}-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
